services:
  voice:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./models/sensevoice:/models:ro
      - ../dist:/static:ro
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 1100m
    cpus: 1.5
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "on-failure:3"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
