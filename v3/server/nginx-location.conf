# Add this location INSIDE the existing HTTPS server {} for the Mahjong site.
# Keep the existing static /majiang/ location and certificate settings.
# Replace the alias with the actual absolute project directory on this server.
location ^~ /majiang/models/ {
    alias /opt/mahjong-v3/server/browser-models/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
}

location ^~ /majiang/api/ {
    limit_req zone=mahjong_voice burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 500k;
    client_body_buffer_size 512k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 50s;
    proxy_buffering off;
    proxy_cache off;
}
